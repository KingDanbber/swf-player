<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Reproductor de juegos SWF con Ruffle. Moderno, responsivo, tema claro/oscuro.">
  <meta name="theme-color" content="#0f172a">
  <title>SWF Player</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = {
      autoplay: 'on',
      unmuteOverlay: 'hidden',
      splashScreen: false,
      contextMenu: 'on'
    };
  </script>
  <!-- Ruffle + JSZip (ZIP de juegos con assets) -->
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>SWF Player</span>
        </div>
      </div>
      <div class="header-right">
        <button id="btn-theme" class="btn-icon" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="main">
      <!-- Drop Zone / Empty State -->
      <section id="drop-zone" class="drop-zone">
        <div class="drop-zone-content">
          <div class="drop-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <h2>Abre un juego SWF</h2>
          <p>Archivo <strong>.swf</strong>, <strong>.zip</strong> o carpeta con assets<br>(lib/, imágenes, etc.)</p>
          <div class="btn-row">
            <button id="btn-select" class="btn-primary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              SWF o ZIP
            </button>
            <button id="btn-folder" class="btn-secondary">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              </svg>
              Carpeta
            </button>
          </div>
          <input type="file" id="file-input" accept=".swf,.zip,application/x-shockwave-flash,application/zip" hidden>
          <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
          <p class="hint">LostLife: ZIP o carpeta <strong>assets</strong> (con lib/ dentro)</p>
        </div>
      </section>

      <!-- Player Section -->
      <section id="player-section" class="player-section hidden">
        <div class="player-header">
          <div class="file-info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
            </svg>
            <span id="file-name">archivo.swf</span>
          </div>
          <div class="player-actions">
            <button id="btn-reload" class="btn-icon" title="Recargar" aria-label="Recargar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
              </svg>
            </button>
            <button id="btn-fullscreen" class="btn-icon" title="Pantalla completa" aria-label="Pantalla completa">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </button>
            <button id="btn-close" class="btn-icon btn-danger" title="Cerrar" aria-label="Cerrar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>

        <div id="player-container" class="player-container">
          <!-- Ruffle player se inserta aquí -->
        </div>

        <div id="loading-overlay" class="loading-overlay hidden">
          <div class="spinner"></div>
          <p>Cargando juego...</p>
        </div>
      </section>
    </main>

    <!-- Status Toast -->
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

    <!-- Footer -->
    <footer class="footer">
      <p>Powered by <a href="https://ruffle.rs" target="_blank" rel="noopener">Ruffle</a></p>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
